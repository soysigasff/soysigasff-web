<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>SOY SIGAS</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #050505;
      color: white;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 50% 20%, rgba(255, 190, 0, 0.10), transparent 28%),
        radial-gradient(circle at 15% 85%, rgba(255, 170, 0, 0.07), transparent 25%),
        #050505;
    }

    /* FONDO */
    .background {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .background::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.18;
      background-image:
        linear-gradient(30deg, #111 12%, transparent 12.5%, transparent 87%, #111 87.5%, #111),
        linear-gradient(150deg, #111 12%, transparent 12.5%, transparent 87%, #111 87.5%, #111),
        linear-gradient(30deg, #111 12%, transparent 12.5%, transparent 87%, #111 87.5%, #111),
        linear-gradient(150deg, #111 12%, transparent 12.5%, transparent 87%, #111 87.5%, #111),
        linear-gradient(60deg, #151515 25%, transparent 25.5%, transparent 75%, #151515 75%);
      background-size: 45px 80px;
      background-position: 0 0, 0 0, 22px 40px, 22px 40px, 0 0;
    }

    .gold-streak {
      position: absolute;
      width: 55vw;
      height: 7px;
      background: linear-gradient(
        90deg,
        transparent,
        #8b5c00,
        #ffd45a,
        #fff0a0,
        #8b5c00,
        transparent
      );
      transform: rotate(-32deg);
      opacity: 0.65;
      filter: blur(1px);
    }

    .streak1 {
      top: 5%;
      left: -18%;
    }

    .streak2 {
      bottom: 9%;
      right: -18%;
      transform: rotate(-32deg);
    }

    .streak3 {
      top: 42%;
      right: -30%;
      transform: rotate(-32deg);
      opacity: 0.25;
    }

    /* CONTENEDOR PRINCIPAL */
    .page {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      padding: 28px 20px 35px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* LOGO */
    .logo-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 5px;
    }

    .logo-circle {
      position: relative;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      border: 5px solid #c99316;
      background:
        radial-gradient(circle, #222 0%, #0b0b0b 70%);
      box-shadow:
        0 0 15px rgba(255, 196, 50, 0.35),
        inset 0 0 25px rgba(255, 190, 30, 0.15);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-circle::before,
    .logo-circle::after {
      content: "";
      position: absolute;
      width: 46px;
      height: 80px;
      border: 4px solid #b47b0b;
      top: 58px;
    }

    .logo-circle::before {
      left: -40px;
      transform: skewY(-20deg) rotate(-18deg);
      border-right: 0;
      border-radius: 20px 0 0 20px;
    }

    .logo-circle::after {
      right: -40px;
      transform: skewY(20deg) rotate(18deg);
      border-left: 0;
      border-radius: 0 20px 20px 0;
    }

    .crown {
      position: absolute;
      top: -43px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 68px;
      line-height: 1;
      filter:
        drop-shadow(0 0 4px #ffcf45)
        drop-shadow(0 4px 2px #4b3100);
    }

    .ss {
      font-size: 92px;
      line-height: 1;
      font-weight: 1000;
      font-style: italic;
      letter-spacing: -12px;
      margin-right: 12px;
      background: linear-gradient(
        180deg,
        #fff2a2 0%,
        #ffc928 30%,
        #b97600 65%,
        #fff0a0 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow:
        3px 3px 0 #382400,
        0 0 8px rgba(255, 199, 45, 0.4);
    }

    .brand {
      margin-top: 25px;
      font-size: clamp(42px, 11vw, 64px);
      font-weight: 1000;
      letter-spacing: 2px;
      line-height: 1;
      text-align: center;
      background: linear-gradient(
        180deg,
        #fff6c3,
        #ffd23b 38%,
        #a96800 72%,
        #fff0a0
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow:
        3px 3px 0 #241700,
        0 0 10px rgba(255, 194, 30, 0.3);
    }

    .brand-line {
      width: 250px;
      height: 4px;
      margin-top: 10px;
      border-radius: 50%;
      background: linear-gradient(
        90deg,
        transparent,
        #ffd33d,
        #fff1a0,
        #ffd33d,
        transparent
      );
      box-shadow: 0 0 8px rgba(255, 205, 55, 0.5);
    }

    /* TITULO */
    .follow-title {
      margin-top: 48px;
      text-align: center;
    }

    .follow-title h1 {
      font-size: clamp(40px, 11vw, 58px);
      font-weight: 1000;
      letter-spacing: 1px;
      line-height: 1;
      color: white;
      text-shadow: 0 4px 8px #000;
    }

    .follow-title p {
      margin-top: 12px;
      font-size: clamp(19px, 5vw, 27px);
      font-weight: 900;
      letter-spacing: 1px;
      color: #f6c72d;
      text-shadow: 0 2px 4px #000;
    }

    /* FACEBOOK */
    .facebook-button {
      width: 100%;
      max-width: 410px;
      min-height: 125px;
      margin-top: 42px;
      padding: 18px 22px;
      border-radius: 25px;
      border: 3px solid #2587ff;
      background: linear-gradient(
        145deg,
        #3b8cff,
        #0757cf
      );
      box-shadow:
        0 0 18px rgba(31, 126, 255, 0.6),
        inset 0 0 12px rgba(255, 255, 255, 0.15);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
      user-select: none;
    }

    .facebook-button:active {
      transform: scale(0.97);
      filter: brightness(0.9);
    }

    .facebook-icon {
      width: 67px;
      height: 67px;
      flex-shrink: 0;
      border-radius: 50%;
      background: white;
      color: #1877f2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 58px;
      font-weight: bold;
      font-family: Arial, sans-serif;
      line-height: 1;
    }

    .facebook-text {
      text-align: left;
    }

    .facebook-name {
      display: block;
      font-size: clamp(24px, 6vw, 34px);
      font-weight: 1000;
      line-height: 1;
      letter-spacing: 1px;
    }

    .facebook-user {
      display: block;
      margin-top: 8px;
      font-size: clamp(21px, 5vw, 27px);
      font-weight: 700;
    }

    /* CONTINUAR */
    .continue-button {
      width: 100%;
      max-width: 410px;
      min-height: 105px;
      margin-top: 48px;
      border-radius: 24px;
      border: 3px solid #4d4d4d;
      background: linear-gradient(
        145deg,
        #444,
        #292929
      );
      color: #999;
      font-size: clamp(28px, 7vw, 39px);
      font-weight: 1000;
      letter-spacing: 1px;
      box-shadow:
        inset 0 0 12px rgba(255, 255, 255, 0.05),
        0 5px 15px rgba(0, 0, 0, 0.5);
      cursor: not-allowed;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: all 0.25s ease;
    }

    .lock {
      font-size: 37px;
    }

    /* ESTADO DESBLOQUEADO */
    .continue-button.unlocked {
      border-color: #e8b62b;
      background: linear-gradient(
        145deg,
        #ffd83e,
        #c58200
      );
      color: #171717;
      cursor: pointer;
      box-shadow:
        0 0 20px rgba(255, 197, 40, 0.55),
        inset 0 0 12px rgba(255, 255, 255, 0.25);
      animation: pulseButton 1.8s infinite;
    }

    .continue-button.unlocked .lock {
      display: none;
    }

    .continue-button:active {
      transform: scale(0.97);
    }

    @keyframes pulseButton {
      0%, 100% {
        box-shadow: 0 0 15px rgba(255, 197, 40, 0.35);
      }

      50% {
        box-shadow: 0 0 28px rgba(255, 197, 40, 0.75);
      }
    }

    /* TEXTO INFERIOR */
    .footer {
      margin-top: 25px;
      text-align: center;
      font-size: 13px;
      color: #555;
      letter-spacing: 1px;
    }

    /* MÓVILES PEQUEÑOS */
    @media (max-width: 380px) {
      .page {
        padding-left: 15px;
        padding-right: 15px;
      }

      .logo-circle {
        width: 155px;
        height: 155px;
      }

      .ss {
        font-size: 75px;
      }

      .crown {
        font-size: 55px;
        top: -37px;
      }

      .facebook-button {
        min-height: 105px;
        gap: 13px;
      }

      .facebook-icon {
        width: 55px;
        height: 55px;
        font-size: 48px;
      }

      .continue-button {
        min-height: 90px;
      }
    }
  </style>
</head>

<body>

  <div class="background">
    <div class="gold-streak streak1"></div>
    <div class="gold-streak streak2"></div>
    <div class="gold-streak streak3"></div>
  </div>

  <main class="page">

    <!-- LOGO -->
    <section class="logo-area">

      <div class="logo-circle">
        <div class="crown">♛</div>
        <div class="ss">SS</div>
      </div>

      <div class="brand">SOY SIGAS</div>
      <div class="brand-line"></div>

    </section>

    <!-- TITULO -->
    <section class="follow-title">
      <h1>SÍGUEME</h1>
      <p>EN MI RED PARA CONTINUAR</p>
    </section>

    <!-- FACEBOOK -->
    <button
      id="facebookButton"
      class="facebook-button"
      type="button"
      onclick="abrirFacebook()"
    >

      <span class="facebook-icon">f</span>

      <span class="facebook-text">
        <span class="facebook-name">FACEBOOK</span>
        <span class="facebook-user">Soy Sigas</span>
      </span>

    </button>

    <!-- CONTINUAR -->
    <button
      id="continueButton"
      class="continue-button"
      type="button"
      disabled
      onclick="continuar()"
    >
      <span>CONTINUAR</span>
      <span class="lock">🔒</span>
    </button>

    <div class="footer">
      SOY SIGAS
    </div>

  </main>


  <script>

    /*
      ==========================================================
      CONFIGURACIÓN
      ==========================================================
    */

    const FACEBOOK_URL =
      "https://www.facebook.com/profile.php?id=61593805138979";

    const MEDIAFIRE_URL =
      "https://www.mediafire.com/file/8724i5ox56kjb1b/FLASH+V25_21.0.apk/file";

    const TIEMPO_REQUERIDO = 25 * 1000;


    /*
      ==========================================================
      ESTADO
      ==========================================================
    */

    let facebookVisitStart = null;
    let facebookCompleted = false;


    /*
      ==========================================================
      ABRIR FACEBOOK
      ==========================================================
    */

    function abrirFacebook() {

      /*
        Guardamos el momento exacto en que la persona
        pulsa Facebook.
      */

      facebookVisitStart = Date.now();

      /*
        Guardamos el momento también para poder comprobarlo
        cuando el usuario regrese al sitio.
      */

      sessionStorage.setItem(
        "facebookVisitStart",
        facebookVisitStart.toString()
      );

      sessionStorage.setItem(
        "facebookCompleted",
        "false"
      );

      /*
        Abrimos Facebook en una nueva pestaña.
        Así el sitio queda disponible cuando el usuario
        regrese.
      */

      window.open(
        FACEBOOK_URL,
        "_blank",
        "noopener,noreferrer"
      );

    }


    /*
      ==========================================================
      COMPROBAR LOS 25 SEGUNDOS
      ==========================================================
    */

    function comprobarFacebook() {

      const savedStart =
        sessionStorage.getItem("facebookVisitStart");

      const completed =
        sessionStorage.getItem("facebookCompleted");

      if (!savedStart || completed === "true") {
        return;
      }

      const inicio = parseInt(savedStart, 10);

      if (isNaN(inicio)) {
        return;
      }

      const tiempoTranscurrido =
        Date.now() - inicio;

      /*
        Si han pasado al menos 25 segundos,
        desbloqueamos CONTINUAR.
      */

      if (tiempoTranscurrido >= TIEMPO_REQUERIDO) {

        facebookCompleted = true;

        sessionStorage.setItem(
          "facebookCompleted",
          "true"
        );

        desbloquearContinuar();

      }

    }


    /*
      ==========================================================
      DESBLOQUEAR CONTINUAR
      ==========================================================
    */

    function desbloquearContinuar() {

      const button =
        document.getElementById("continueButton");

      button.disabled = false;

      button.classList.add("unlocked");

    }


    /*
      ==========================================================
      CONTINUAR
      ==========================================================
    */

    function continuar() {

      if (!facebookCompleted) {
        return;
      }

      /*
        Abrimos directamente MediaFire.
      */

      window.location.href = MEDIAFIRE_URL;

    }


    /*
      ==========================================================
      CUANDO EL USUARIO REGRESA AL SITIO
      ==========================================================
    */

    document.addEventListener(
      "visibilitychange",
      function() {

        if (
          document.visibilityState === "visible"
        ) {

          comprobarFacebook();

        }

      }
    );


    window.addEventListener(
      "pageshow",
      function() {

        comprobarFacebook();

      }
    );


    /*
      También comprobamos periódicamente,
      pero SIN MOSTRAR ningún contador.
    */

    setInterval(
      comprobarFacebook,
      1000
    );


    /*
      Comprobación inicial.
    */

    comprobarFacebook();

  </script>

</body>
    </html>
